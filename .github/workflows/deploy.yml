name: Build and deploy to Pages

# This workflow rebuilds the site from /content on every push to main
# and publishes the result to GitHub Pages.
#
# To use it: in your repo Settings -> Pages, set "Source" to "GitHub Actions".
# Then this workflow will deploy automatically.
#
# If you prefer the simpler "Source: branch /docs" approach instead,
# just delete this file. The build.py script already maintains /docs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 build/build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
