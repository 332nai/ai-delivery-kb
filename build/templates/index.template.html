<!DOCTYPE html>
<html lang="en" data-theme="editorial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<title>AI Delivery Knowledge Base / AI 交付知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
__CSS__
</style>
</head>
<body>

<header class="mobile-bar" id="mobileBar">
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div class="mobile-bar-brand" onclick="showWelcome(); closeDrawer();">
    <span class="mobile-bar-title">AI Delivery</span>
    <span class="mobile-bar-sub">KB</span>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark">A field manual</div>
      <div class="brand-title">AI Delivery</div>
      <div class="brand-title">Knowledge Base</div>
      <div class="brand-title-zh">AI 交付知识库</div>
    </div>

    <div class="controls">
      <div class="toggle-row">
        <span class="toggle-label" id="langLabel">Lang</span>
        <div class="lang-toggle" id="langToggle">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="zh">中文</button>
        </div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label" id="themeLabel">Style</span>
        <div class="theme-toggle" id="themeToggle">
          <button data-theme="editorial" class="active">Editorial</button>
          <button data-theme="atelier">Atelier</button>
          <button data-theme="terminal">Terminal</button>
        </div>
      </div>
    </div>

    <div class="nav-meta" id="navMeta"></div>

    <ul class="topic-list" id="topicList"></ul>
  </aside>

  <main class="main">
    <nav class="breadcrumb" id="breadcrumb" style="display: none;"></nav>
    <div class="main-inner">
      <div class="search-bar" id="searchBar">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/>
          <line x1="11" y1="11" x2="14" y2="14" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search titles and teasers..." autocomplete="off" spellcheck="false"/>
        <button class="search-clear" id="searchClear" aria-label="Clear" style="display:none;">×</button>
      </div>
      <section class="welcome" id="welcome"></section>
      <article class="article" id="article"></article>
    </div>
  </main>

</div>

<script>
__JS__
</script>

</body>
</html>
