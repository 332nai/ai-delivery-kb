<!DOCTYPE html>
<html lang="en" data-theme="editorial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<title>AI Delivery Knowledge Base / AI 交付知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* === Theme variables === */
/* Default theme: editorial */
:root, [data-theme="editorial"] {
  --bg: #faf8f3;
  --bg-elevated: #ffffff;
  --paper: #f3eee2;
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-muted: #8a8580;
  --rule: #d8d2c4;
  --rule-soft: #e8e3d6;
  --accent: #a83232;
  --accent-soft: #c84a4a;
  --accent-bg: #f5e9c8;
  --code-bg: #efeadc;
  --code-fg: #1a1a1a;
  --link-hover: #a83232;
  --serif: 'Fraunces', 'Noto Serif SC', Georgia, serif;
  --sans: 'Inter Tight', 'Noto Sans SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --display-font: var(--serif);
  --display-weight: 400;
  --display-letter: -0.02em;
  --display-style: normal;
  --title-line: 1.12;
  --accent-italic: italic;
  --section-decor: bar;
  --takeaway-shape: rect;
  --shadow-soft: 0 1px 0 rgba(0,0,0,0.02);
}

/* Terminal theme */
[data-theme="terminal"] {
  --bg: #0e1014;
  --bg-elevated: #15181f;
  --paper: #181b22;
  --ink: #e8e4d8;
  --ink-soft: #b8b3a5;
  --ink-muted: #6c6a62;
  --rule: #2a2d36;
  --rule-soft: #1f222a;
  --accent: #f0c674;
  --accent-soft: #d6a85a;
  --accent-bg: #2a2418;
  --code-bg: #0a0c10;
  --code-fg: #d4cdb8;
  --link-hover: #f0c674;
  --serif: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'JetBrains Mono', ui-monospace, monospace;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --display-font: var(--mono);
  --display-weight: 500;
  --display-letter: -0.01em;
  --display-style: normal;
  --title-line: 1.25;
  --accent-italic: normal;
  --section-decor: bracket;
  --takeaway-shape: terminal;
  --shadow-soft: none;
}
[data-theme="terminal"] body {
  background-image:
    radial-gradient(circle at 20% 10%, rgba(240, 198, 116, 0.03), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(240, 198, 116, 0.02), transparent 50%);
}

/* Atelier theme */
[data-theme="atelier"] {
  --bg: #f6f5f1;
  --bg-elevated: #ffffff;
  --paper: #eeece6;
  --ink: #1f201d;
  --ink-soft: #565751;
  --ink-muted: #9a9a91;
  --rule: #dad9d2;
  --rule-soft: #e6e5de;
  --accent: #1d6160;
  --accent-soft: #2a7c7b;
  --accent-bg: #e3ebea;
  --code-bg: #efeee8;
  --code-fg: #1f201d;
  --link-hover: #1d6160;
  --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
  --sans: 'DM Sans', 'Noto Sans SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --display-font: var(--serif);
  --display-weight: 300;
  --display-letter: -0.015em;
  --display-style: normal;
  --title-line: 1.05;
  --accent-italic: italic;
  --section-decor: dot;
  --takeaway-shape: card;
  --shadow-soft: 0 1px 2px rgba(0,0,0,0.03);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background 0.3s ease, color 0.3s ease;
}

/* === Layout === */
.app {
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: 100vh;
}

/* === Sidebar === */
.sidebar {
  background: var(--paper);
  border-right: 1px solid var(--rule);
  padding: 32px 28px 60px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.brand {
  margin-bottom: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
}
.brand-mark {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}
[data-theme="editorial"] .brand-mark {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
}
.brand-title {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-size: 24px;
  line-height: 1.15;
  letter-spacing: var(--display-letter);
  margin-bottom: 2px;
}
[data-theme="atelier"] .brand-title { font-weight: 400; }
[data-theme="terminal"] .brand-title { font-size: 18px; font-weight: 600; }
.brand-title-zh {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-size: 18px;
  line-height: 1.3;
  color: var(--ink-soft);
  margin-top: 6px;
}
[data-theme="terminal"] .brand-title-zh { font-size: 14px; }

.controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}

.lang-toggle, .theme-toggle {
  display: flex;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px;
  background: var(--bg-elevated);
  width: fit-content;
}
[data-theme="terminal"] .lang-toggle,
[data-theme="terminal"] .theme-toggle { border-radius: 4px; }

.lang-toggle button, .theme-toggle button {
  background: none;
  border: 0;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.06em;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--ink-muted);
  transition: all 0.2s ease;
}
[data-theme="terminal"] .lang-toggle button,
[data-theme="terminal"] .theme-toggle button {
  border-radius: 3px;
  text-transform: lowercase;
}
.lang-toggle button.active, .theme-toggle button.active {
  background: var(--ink);
  color: var(--bg);
}
[data-theme="terminal"] .lang-toggle button.active,
[data-theme="terminal"] .theme-toggle button.active {
  background: var(--accent);
  color: var(--bg);
}

.toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.toggle-label {
  font-family: var(--sans);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  width: 56px;
  flex-shrink: 0;
}

.nav-meta {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 14px;
}

.topic-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.topic {
  margin-bottom: 6px;
}
.topic-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0 6px;
  cursor: pointer;
  user-select: none;
}
.topic-num {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--accent);
  min-width: 26px;
}
.topic-name {
  font-family: var(--display-font);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.3;
  flex: 1;
  letter-spacing: -0.005em;
}
[data-theme="atelier"] .topic-name { font-weight: 400; font-size: 16px; }
[data-theme="terminal"] .topic-name { font-size: 13px; font-weight: 500; }
.topic-chevron {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-muted);
  transition: transform 0.2s ease;
}
.topic.open .topic-chevron { transform: rotate(90deg); }
.topic-subtitle {
  font-family: var(--serif);
  font-style: var(--accent-italic);
  font-size: 12px;
  color: var(--ink-muted);
  margin: 0 0 4px 36px;
  line-height: 1.35;
}
[data-theme="terminal"] .topic-subtitle { font-size: 11px; opacity: 0.7; }

.item-list {
  list-style: none;
  margin: 4px 0 12px 32px;
  padding: 0 0 0 12px;
  border-left: 1px solid var(--rule);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.topic.open .item-list { max-height: 700px; }
.item-link {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 10px;
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.35;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 4px;
  text-decoration: none;
  transition: all 0.15s ease;
}
[data-theme="terminal"] .item-link { font-size: 12px; border-radius: 2px; }
.item-link:hover { background: var(--bg-elevated); color: var(--ink); }
.item-link.active { background: var(--ink); color: var(--bg); }
.item-link.active .item-num { color: var(--bg); }
[data-theme="terminal"] .item-link.active { background: var(--accent); color: var(--bg); }
[data-theme="terminal"] .item-link.active .item-num { color: var(--bg); }
.item-num {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* === Main === */
.main {
  padding: 0;
  max-width: 100%;
  position: relative;
}

/* Breadcrumb */
.breadcrumb {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
  padding: 14px 80px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--sans);
  font-size: 12px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
[data-theme="terminal"] .breadcrumb {
  background: rgba(14, 16, 20, 0.92);
  font-size: 11px;
}
.breadcrumb a {
  color: var(--ink-soft);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.breadcrumb a:hover { color: var(--link-hover); }
.breadcrumb .sep {
  color: var(--ink-muted);
  font-size: 10px;
}
.breadcrumb .current {
  color: var(--accent);
  font-weight: 500;
}
[data-theme="terminal"] .breadcrumb .current { color: var(--accent); }
.breadcrumb .home-icon {
  display: inline-block;
  width: 12px;
  height: 12px;
}

.main-inner {
  padding: 56px 80px 120px;
  max-width: 920px;
}

/* === Landing === */
.welcome { padding-top: 16px; }
.welcome-eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
}
.welcome-title {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-size: 56px;
  line-height: var(--title-line);
  letter-spacing: var(--display-letter);
  margin: 0 0 14px;
  max-width: 760px;
}
[data-theme="atelier"] .welcome-title { font-size: 64px; font-weight: 300; }
[data-theme="terminal"] .welcome-title { font-size: 36px; font-weight: 500; }
.welcome-title em {
  font-style: var(--accent-italic);
  font-weight: 300;
  color: var(--accent);
}
[data-theme="terminal"] .welcome-title em { font-weight: 500; }
.welcome-subtitle {
  font-family: var(--serif);
  font-style: var(--accent-italic);
  font-size: 22px;
  font-weight: 300;
  line-height: 1.3;
  color: var(--ink-soft);
  margin: 0 0 48px;
  max-width: 640px;
}
[data-theme="terminal"] .welcome-subtitle { font-size: 16px; font-style: normal; opacity: 0.85; }
.welcome-rule {
  width: 60px;
  height: 1px;
  background: var(--accent);
  margin: 0 0 32px;
}
[data-theme="terminal"] .welcome-rule { width: 80px; height: 2px; }
.welcome-desc {
  font-size: 17px;
  line-height: 1.7;
  max-width: 640px;
  color: var(--ink-soft);
  margin-bottom: 56px;
}
[data-theme="terminal"] .welcome-desc { font-size: 14px; }

.topic-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--rule);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
[data-theme="atelier"] .topic-grid {
  gap: 16px;
  background: transparent;
  border: 0;
}
[data-theme="terminal"] .topic-grid {
  gap: 1px;
  border: 1px solid var(--rule);
}
.topic-card {
  background: var(--bg);
  padding: 24px 28px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}
[data-theme="atelier"] .topic-card {
  background: var(--bg-elevated);
  border-radius: 6px;
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-soft);
}
[data-theme="atelier"] .topic-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
[data-theme="terminal"] .topic-card { background: var(--bg-elevated); }
.topic-card:hover { background: var(--bg-elevated); }
[data-theme="terminal"] .topic-card:hover {
  background: var(--paper);
  outline: 1px solid var(--accent);
  outline-offset: -1px;
}

.topic-card-num {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--accent);
  margin-bottom: 10px;
}
[data-theme="terminal"] .topic-card-num::before { content: "// "; opacity: 0.5; }
.topic-card-title {
  font-family: var(--display-font);
  font-weight: 500;
  font-size: 22px;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}
[data-theme="atelier"] .topic-card-title { font-weight: 400; font-size: 26px; }
[data-theme="terminal"] .topic-card-title { font-size: 16px; font-weight: 500; }
.topic-card-sub {
  font-family: var(--serif);
  font-style: var(--accent-italic);
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.4;
}
[data-theme="terminal"] .topic-card-sub { font-style: normal; font-size: 12px; }
.topic-card-count {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 12px;
}

/* === Article === */
.article { display: none; }
.article.active { display: block; }

.article-eyebrow {
  display: flex;
  align-items: baseline;
  gap: 14px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 20px;
}
.article-eyebrow .num {
  color: var(--accent);
  font-weight: 600;
}
.article-eyebrow .sep { color: var(--rule); }

.article-title {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-size: 40px;
  line-height: var(--title-line);
  letter-spacing: var(--display-letter);
  margin: 0 0 12px;
  max-width: 780px;
}
[data-lang="zh"] .article-title { font-weight: 500; font-size: 36px; }
[data-theme="atelier"] .article-title { font-weight: 300; font-size: 46px; }
[data-theme="atelier"] [data-lang="zh"] .article-title { font-weight: 400; font-size: 38px; }
[data-theme="terminal"] .article-title { font-size: 26px; font-weight: 500; }
[data-theme="terminal"] [data-lang="zh"] .article-title { font-size: 24px; }
[data-theme="terminal"] .article-title::before { content: "# "; color: var(--accent); }

.article-alt-title {
  font-family: var(--serif);
  font-style: var(--accent-italic);
  font-size: 19px;
  font-weight: 300;
  line-height: 1.35;
  color: var(--ink-muted);
  margin: 0 0 36px;
  max-width: 720px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--rule-soft);
}
[data-theme="terminal"] .article-alt-title { font-style: normal; font-size: 14px; opacity: 0.7; }
[data-theme="terminal"] .article-alt-title::before { content: "// "; opacity: 0.5; }

.article-body {
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink);
}
[data-theme="terminal"] .article-body { font-size: 14px; line-height: 1.65; }

.article-body h3 {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 44px 0 14px;
  padding-top: 6px;
  position: relative;
}

/* Section decoration variants */
[data-theme="editorial"] .article-body h3::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 0;
  width: 24px;
  height: 1px;
  background: var(--accent);
}
[data-theme="atelier"] .article-body h3 {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.2em;
}
[data-theme="atelier"] .article-body h3::before {
  content: '\2022\00a0\00a0';
  color: var(--accent);
}
[data-theme="terminal"] .article-body h3 {
  font-family: var(--mono);
  text-transform: lowercase;
  letter-spacing: 0;
  font-size: 13px;
}
[data-theme="terminal"] .article-body h3::before {
  content: "[ ";
  color: var(--ink-muted);
}
[data-theme="terminal"] .article-body h3::after {
  content: " ]";
  color: var(--ink-muted);
}

.article-body p {
  margin: 0 0 18px;
  max-width: 680px;
}
.article-body strong { font-weight: 600; }
.article-body em { font-style: italic; }
[data-theme="terminal"] .article-body em {
  font-style: normal;
  color: var(--accent);
}
[data-theme="terminal"] .article-body strong {
  color: var(--ink);
}

/* Standalone bold paragraphs (Definition, Why it matters, How it works, PM decision points, Watch outs).
   Tagged by JS as .is-section-header to distinguish from paragraphs with inline strong emphasis. */
.article-body p.is-section-header {
  margin: 40px 0 14px;
}
.article-body p.is-section-header > strong {
  display: inline-block;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  position: relative;
}
[data-theme="editorial"] .article-body p.is-section-header > strong::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 0;
  width: 24px;
  height: 1px;
  background: var(--accent);
}
[data-theme="atelier"] .article-body p.is-section-header > strong {
  font-family: var(--sans);
  font-weight: 500;
  letter-spacing: 0.2em;
}
[data-theme="atelier"] .article-body p.is-section-header > strong::before {
  content: '\2022\00a0\00a0';
  color: var(--accent);
  font-weight: 400;
}
[data-theme="terminal"] .article-body p.is-section-header > strong {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 12px;
  text-transform: lowercase;
  letter-spacing: 0;
}
[data-theme="terminal"] .article-body p.is-section-header > strong::before {
  content: "[ ";
  color: var(--ink-muted);
}
[data-theme="terminal"] .article-body p.is-section-header > strong::after {
  content: " ]";
  color: var(--ink-muted);
}

.article-body ul, .article-body ol {
  margin: 0 0 20px;
  padding-left: 22px;
  max-width: 680px;
}
.article-body li { margin-bottom: 8px; line-height: 1.65; }
.article-body li::marker { color: var(--accent); }
[data-theme="terminal"] .article-body ul { list-style: none; padding-left: 0; }
[data-theme="terminal"] .article-body ul li::before {
  content: "› ";
  color: var(--accent);
  margin-right: 6px;
}

/* Tables */
.article-body table {
  border-collapse: collapse;
  margin: 22px 0 28px;
  width: 100%;
  max-width: 780px;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;

}

/* ============================================================
   Mobile top bar (visible only on small screens)
   ============================================================ */
.mobile-bar {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);

  gap: 12px;
}
.mobile-menu-btn {
  background: none;
  border: 0;
  color: var(--ink);
  padding: 6px;

  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
}
.mobile-menu-btn:hover { background: var(--paper); }
.mobile-menu-btn svg { width: 22px; height: 22px; }

}

  font-size: 17px;

}

.mobile-bar-sub {

}

/* ============================================================
   Drawer overlay (mobile sidebar backdrop)
   ============================================================ */
.drawer-overlay {
  display: none;

  inset: 0;

  z-index: 150;
  opacity: 0;
  transition: opacity 0.25s ease;
}

/* ============================================================
   Mobile layout: drawer sidebar, top bar, tightened article
   ============================================================ */
@media (max-width: 900px) {
  /* Mobile bar visible */
  .mobile-bar { display: flex; }
  
  /* Body padding to clear the fixed top bar */
  body {
    padding-top: 52px;
    padding-top: calc(52px + env(safe-area-inset-top));
  }
  
  /* App becomes single-column */
  .app { 
    grid-template-columns: 1fr;
    min-height: calc(100vh - 52px);
  }
  
  /* Sidebar becomes a drawer */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 86%;
    max-width: 360px;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    z-index: 200;
    border-right: 1px solid var(--rule);
    border-bottom: 0;
    transform: translateX(-100%);
    transition: transform 0.28s ease;
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0);
    padding-top: calc(20px + env(safe-area-inset-top));
  }
  
  body.drawer-open .sidebar {
    transform: translateX(0);
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
  }
  
  body.drawer-open .drawer-overlay {
    display: block;
    opacity: 1;
  }
  
  /* Main content takes full width */
  .main { width: 100%; }
  .main-inner {
    padding: 28px 20px 80px;
  }
  
  /* Breadcrumb: compact, hide home label and topic name */

    padding: 10px 20px;
    font-size: 11px;
    gap: 6px;

  .breadcrumb .crumb-current {
    flex: 1;
    min-width: 0;

  .breadcrumb .crumb-title {
    max-width: 100%;
  }
  
  /* Welcome page */
  .welcome-title { font-size: 30px; line-height: 1.15; }
  [data-theme="atelier"] .welcome-title { font-size: 36px; }
  [data-theme="terminal"] .welcome-title { font-size: 24px; }
  .welcome-subtitle { font-size: 17px; margin-bottom: 32px; }
  .welcome-desc { font-size: 15px; margin-bottom: 40px; }
  .welcome-volume { margin-bottom: 40px; }
  .welcome-volume-title { font-size: 22px; }
  [data-theme="atelier"] .welcome-volume-title { font-size: 26px; }
  .welcome-volume-subtitle { font-size: 13px; }
  
  .topic-grid { grid-template-columns: 1fr; }
  .topic-card { padding: 18px 20px; }
  .topic-card-title { font-size: 19px; }
  [data-theme="atelier"] .topic-card-title { font-size: 22px; }
  
  /* Article body: bigger line height, slightly smaller font */
  .article-title { font-size: 26px; line-height: 1.2; }
  [data-lang="zh"] .article-title { font-size: 24px; }
  [data-theme="atelier"] .article-title { font-size: 30px; }
  .article-alt-title { font-size: 16px; margin-bottom: 24px; padding-bottom: 18px; }
  
  .article-body {
    font-size: 16px;
    line-height: 1.75;
  }
  .article-body p {
    margin: 0 0 18px;
    max-width: 100%;
  }
  .article-body ul, .article-body ol { max-width: 100%; padding-left: 20px; }
  
  /* Tighter section spacing on small screens */
  .article-body p.is-section-header { margin: 32px 0 12px; }
  .article-body h3 { margin: 32px 0 12px; }
  
  /* Takeaway: tighter */
  .takeaway { margin: 24px 0; padding: 18px 20px; max-width: 100%; }
  .takeaway-body { font-size: 16px; }
  [data-theme="atelier"] .takeaway-body { font-size: 17px; }
  
  /* Qantas section */
  .qantas-section { margin-top: 40px; padding-top: 24px; }
  .qantas-mark::before, .qantas-mark::after { max-width: 30px; }
  
  /* Article TOC: stacks vertically on mobile */
  .article-toc {
    padding: 14px 16px;
    margin-bottom: 28px;
  }
  .article-toc ul {
    flex-direction: column;
    gap: 8px;
  }
  
  /* Item nav at bottom: stacks vertically */
  .item-nav {
    flex-direction: column;
    gap: 20px;
    margin-top: 60px;
    padding-top: 24px;
  }
  .item-nav .prev, .item-nav .next {
    text-align: left;
  }
  
  /* Tables: ensure they don't break layout */
  .table-scroll { margin: 18px -20px 24px; padding: 0 20px; }

    font-size: 13px;
    min-width: 100%;

    padding: 10px 12px;

  /* Brand inside drawer: less prominent, since mobile bar shows the brand */
  .sidebar .brand {
    margin-bottom: 18px;

  .sidebar .brand-mark { font-size: 9px; }

  .sidebar .brand-title-zh { font-size: 15px; }
  
  /* Controls inside drawer: wrap nicely */
  .controls { gap: 10px; margin-bottom: 22px; }
}

/* Very small screens: even tighter */
@media (max-width: 480px) {
  .main-inner { padding: 24px 18px 64px; }

  .article-title { font-size: 23px; }
  [data-lang="zh"] .article-title { font-size: 22px; }
  .welcome-title { font-size: 26px; }
  .mobile-bar { padding: 0 12px; gap: 10px; }
}

function getNavMeta() {
  const topicCount = KB.length;
  const itemCount = KB.reduce((acc, t) => acc + t.items.length, 0);
  const volumeCount = VOLUMES.length;
  if (currentLang === 'en') {
    return `${volumeCount} volumes &middot; ${topicCount} topics &middot; ${itemCount} items`;
  }
  return `${volumeCount} \u5377 &middot; ${topicCount} \u4e2a\u4e3b\u9898 &middot; ${itemCount} \u4e2a\u6761\u76ee`;
}

function getWelcomeSubtitle() {
  const topicCount = KB.length;
  const itemCount = KB.reduce((acc, t) => acc + t.items.length, 0);
  if (currentLang === 'en') {
    return `Definitions, decision points, watch outs, and stories from the field. ${itemCount} items across ${topicCount} topics.`;
  }
  return `\u5b9a\u4e49\u3001\u51b3\u7b56\u70b9\u3001\u6ce8\u610f\u4e8b\u9879,\u4ee5\u53ca\u6765\u81ea\u73b0\u573a\u7684\u6848\u4f8b\u3002${topicCount} \u4e2a\u4e3b\u9898,${itemCount} \u4e2a\u6761\u76ee\u3002`;
}

const THEMES = {
  editorial: { en: 'Editorial', zh: '\u6742\u5fd7' },
  atelier: { en: 'Atelier', zh: '\u5de5\u574a' },
  terminal: { en: 'Terminal', zh: '\u7ec8\u7aef' }
};

let currentLang = 'en';
let currentTheme = 'editorial';
let currentItem = null;

// === Markdown parser ===
function parseMarkdown(text) {
  text = text.replace(/\r\n/g, '\n');
  let html = '';
  const lines = text.split('\n');
  let i = 0;
  let inList = false;
  let listType = null;
  let inCode = false;
  let codeBuffer = [];

  function flushList() {
    if (inList) {
      html += '</' + listType + '>\n';
      inList = false;
      listType = null;
    }
  }

  function inline(s) {
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    return s;
  }

  while (i < lines.length) {
    const line = lines[i];

    if (line.startsWith('```')) {
      if (inCode) {
        html += '<pre><code>' + codeBuffer.join('\n').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>\n';
        codeBuffer = [];
        inCode = false;
      } else {
        flushList();
        inCode = true;
      }
      i++;
      continue;
    }
    if (inCode) { codeBuffer.push(line); i++; continue; }

    if (line.trim().startsWith('|') && i + 1 < lines.length && /^\s*\|\s*[-:]+/.test(lines[i + 1])) {
      flushList();
      const headerCells = line.split('|').slice(1, -1).map(c => c.trim());
      i += 2;
      let t = '<div class="table-scroll"><table><thead><tr>';
      headerCells.forEach(c => t += '<th>' + inline(c) + '</th>');
      t += '</tr></thead><tbody>';
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        const cells = lines[i].split('|').slice(1, -1).map(c => c.trim());
        t += '<tr>';
        cells.forEach(c => t += '<td>' + inline(c) + '</td>');
        t += '</tr>';
        i++;
      }
      t += '</tbody></table></div>\n';
      html += t;
      continue;
    }

    if (/^[\s]*[-*]\s+/.test(line)) {
      if (!inList || listType !== 'ul') { flushList(); html += '<ul>\n'; inList = true; listType = 'ul'; }
      html += '<li>' + inline(line.replace(/^[\s]*[-*]\s+/, '')) + '</li>\n';
      i++; continue;
    }
    if (/^[\s]*\d+\.\s+/.test(line)) {
      if (!inList || listType !== 'ol') { flushList(); html += '<ol>\n'; inList = true; listType = 'ol'; }
      html += '<li>' + inline(line.replace(/^[\s]*\d+\.\s+/, '')) + '</li>\n';
      i++; continue;
    }

    if (/^---+\s*$/.test(line)) { flushList(); i++; continue; }
    if (line.trim() === '') { flushList(); i++; continue; }
    if (line.startsWith('### ')) { flushList(); html += '<h3>' + inline(line.slice(4)) + '</h3>\n'; i++; continue; }

    if (/^<(div|svg|figure|section|aside|table|nav|details|p|blockquote|pre)\b/.test(line)) {
      flushList();
      let buf = line;
      i++;
      while (i < lines.length && lines[i].trim() !== '') {
        buf += '\n' + lines[i];
        i++;
      }
      html += buf + '\n';
      continue;
    }

    flushList();
    let para = line;
    i++;
    while (i < lines.length && lines[i].trim() !== '' && !lines[i].startsWith('#')
           && !lines[i].trim().startsWith('|') && !lines[i].startsWith('```')
           && !/^[\s]*[-*]\s+/.test(lines[i]) && !/^[\s]*\d+\.\s+/.test(lines[i])
           && !/^---+\s*$/.test(lines[i])) {
      para += ' ' + lines[i];
      i++;
    }
    html += '<p>' + inline(para) + '</p>\n';
  }
  flushList();
  return html;
}

function getStr(key) { return STRINGS[currentLang][key]; }
function getTitle(t) { return t['title_' + currentLang]; }
function getAltTitle(t) { return t['title_' + (currentLang === 'en' ? 'zh' : 'en')]; }
function getBody(it) { return it['body_' + currentLang]; }
function getSubtitle(t) { return t['subtitle_' + currentLang]; }
function topicsInVolume(volNum) { return KB.filter(t => t.volume === volNum); }

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentItem) {
    bc.style.display = 'none';
    return;
  }
  bc.style.display = 'flex';
  const topic = KB.find(t => t.num === currentItem.topic);
  const item = topic.items.find(it => it.num === currentItem.item);
  bc.innerHTML = `
    <a class="crumb crumb-home" onclick="showWelcome()" title="${getStr('home')}">
      <svg class="home-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 7L8 2L14 7V14H10V10H6V14H2V7Z"/>
      </svg>
      <span class="crumb-label">${getStr('home')}</span>
    </a>
    <span class="sep">/</span>
    <a class="crumb crumb-topic" onclick="showItem(${topic.num}, '${topic.items[0].num}')">${getTitle(topic)}</a>
    <span class="sep">/</span>
    <span class="crumb crumb-current">
      <span class="crumb-num">${item.num}</span>
      <span class="crumb-title">${getTitle(item)}</span>
    </span>
  `;
}

function renderSidebar() {
  const list = document.getElementById('topicList');
  list.innerHTML = '';
  
  VOLUMES.forEach((vol, vIdx) => {
    const topics = topicsInVolume(vol.num);
    if (topics.length === 0) return;
    
    const volHeader = document.createElement('li');
    volHeader.className = 'volume-header';
    if (vIdx > 0) volHeader.classList.add('volume-header-spaced');
    volHeader.innerHTML = `
      <div class="volume-title">${vol['title_' + currentLang]}</div>
      <div class="volume-subtitle">${vol['subtitle_' + currentLang]}</div>
    `;
    list.appendChild(volHeader);
    
    topics.forEach(topic => {
      const li = document.createElement('li');
      li.className = 'topic';
      li.dataset.topic = topic.num;
      if (currentItem && currentItem.topic === topic.num) li.classList.add('open');

      const header = document.createElement('div');
      header.className = 'topic-header';
      header.innerHTML = `
        <span class="topic-num">T${String(topic.num).padStart(2, '0')}</span>
        <span class="topic-name">${getTitle(topic)}</span>
        <span class="topic-chevron">\u25b8</span>
      `;
      header.onclick = () => li.classList.toggle('open');

      const subtitle = document.createElement('div');
      subtitle.className = 'topic-subtitle';
      subtitle.textContent = getSubtitle(topic);

      const items = document.createElement('ul');
      items.className = 'item-list';
      topic.items.forEach(item => {
        const a = document.createElement('a');
        a.className = 'item-link';
        if (currentItem && currentItem.item === item.num) a.classList.add('active');
        a.innerHTML = `<span class="item-num">${item.num}</span><span class="item-link-title">${getTitle(item)}</span>`;
        a.onclick = (e) => { 
          e.preventDefault(); 
          showItem(topic.num, item.num); 
          closeDrawer();
        };
        items.appendChild(a);
      });

      li.appendChild(header);
      li.appendChild(subtitle);
      li.appendChild(items);
      list.appendChild(li);
    });
  });

  document.querySelectorAll('.brand-title')[0].textContent = getStr('brandLine1');
  document.querySelectorAll('.brand-title')[1].textContent = getStr('brandLine2');
  document.getElementById('navMeta').innerHTML = getNavMeta();
  const bm = document.getElementById('brandMark');
  if (bm) bm.textContent = getStr('eyebrow');
  document.getElementById('langLabel').textContent = getStr('langLabel');
  document.getElementById('themeLabel').textContent = getStr('themeLabel');
  Object.keys(THEMES).forEach(k => {
    const btn = document.querySelector(`.theme-toggle button[data-theme="${k}"]`);
    if (btn) btn.textContent = THEMES[k][currentLang];
  });
  
  const mb = document.getElementById('mobileMenuBtn');
  if (mb) mb.setAttribute('aria-label', getStr('menu'));
}

function renderWelcome() {
  const w = document.getElementById('welcome');
  
  let volumeSections = '';
  VOLUMES.forEach(vol => {
    const topics = topicsInVolume(vol.num);
    if (topics.length === 0) return;
    
    let grid = '';
    topics.forEach(topic => {
      const count = topic.items.length;
      grid += `
        <div class="topic-card" onclick="showItem(${topic.num}, '${topic.items[0].num}')">
          <div class="topic-card-num">Topic ${String(topic.num).padStart(2, '0')}</div>
          <div class="topic-card-title">${getTitle(topic)}</div>
          <div class="topic-card-sub">${getSubtitle(topic)}</div>
          <div class="topic-card-count">${count} ${getStr('items')}</div>
        </div>
      `;
    });
    
    volumeSections += `
      <section class="welcome-volume">
        <div class="welcome-volume-header">
          <div class="welcome-volume-title">${vol['title_' + currentLang]}</div>
          <div class="welcome-volume-subtitle">${vol['subtitle_' + currentLang]}</div>
        </div>
        <div class="topic-grid">${grid}</div>
      </section>
    `;
  });

  w.innerHTML = `
    <div class="welcome-eyebrow">${getStr('eyebrow')}</div>
    <h1 class="welcome-title">${getStr('welcomeTitle')}</h1>
    <p class="welcome-subtitle">${getWelcomeSubtitle()}</p>
    <div class="welcome-rule"></div>
    <p class="welcome-desc">${getStr('welcomeDesc')}</p>
    ${volumeSections}
  `;
  w.setAttribute('data-lang', currentLang);
}

// Extract section headers from the rendered article body to build a mini TOC.
// We only count a paragraph as a section header if its entire text content is
// essentially just the strong element (allowing for trailing punctuation only).
// We ALSO mark those paragraphs with a class so CSS can style only the real
// section headers, leaving inline emphasis as plain bold.
function buildTOC(articleBodyEl) {
  const toc = [];
  // Process all article-body sections (main and Qantas)
  const allBodies = articleBodyEl.parentElement.querySelectorAll('.article-body');
  const punctRegex = /[\s\u0020-\u002f\u003a-\u0040\u005b-\u0060\u007b-\u007e\u3000-\u303f\uff00-\uffef.,;:!?'"()\[\]{}\-_=+/\\|<>]/g;
  let idCounter = 0;
  allBodies.forEach(bodyEl => {
    const strongs = bodyEl.querySelectorAll('p > strong:only-child');
    strongs.forEach(s => {
      const text = s.textContent.trim();
      const parentText = s.parentElement.textContent;
      const outside = parentText.replace(s.textContent, '');
      const outsideClean = outside.replace(punctRegex, '');
      if (outsideClean.length > 0) return;  // not a section header, leave alone
      
      // It IS a section header: tag the parent paragraph
      s.parentElement.classList.add('is-section-header');
      
      // Add to TOC only for the main body (not Qantas), and skip Takeaway
      if (bodyEl.id !== 'articleMainBody') return;
      if (/^(Takeaway|\u8981\u70b9\u603b\u7ed3)[:\uff1a]/.test(text)) return;
      const id = 'sec-' + (idCounter++) + '-' + text.replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g, '-').toLowerCase().substring(0, 40);
      s.parentElement.id = id;
      toc.push({id, text});
    });
  });
  return toc;
}

function renderArticle(topicNum, itemNum) {
  const topic = KB.find(t => t.num === topicNum);
  const item = topic.items.find(it => it.num === itemNum);
  if (!item) return;

  let body = getBody(item);
  const qantasRe = /\*\*(Qantas story|Qantas \u6848\u4f8b)\*\*/;
  const qantasMatch = body.match(qantasRe);
  let mainPart = body;
  let qantasPart = null;
  if (qantasMatch) {
    const idx = body.indexOf(qantasMatch[0]);
    mainPart = body.substring(0, idx).trim();
    qantasPart = body.substring(idx + qantasMatch[0].length).trim();
  }

  const takeawayRegex = /\*\*(Takeaway|\u8981\u70b9\u603b\u7ed3)[:\uff1a]\s*([^*]+)\*\*/;
  const takeawayMatch = mainPart.match(takeawayRegex);
  if (takeawayMatch) {
    const takeawayHtml = `<div class="takeaway"><div class="takeaway-label">${takeawayMatch[1]}</div><div class="takeaway-body">${takeawayMatch[2].trim()}</div></div>`;
    mainPart = mainPart.replace(takeawayRegex, takeawayHtml);
  }

  const allItems = [];
  KB.forEach(t => t.items.forEach(it => allItems.push({topic: t.num, item: it.num, title: getTitle(it)})));
  const idx = allItems.findIndex(x => x.item === itemNum);
  const prev = idx > 0 ? allItems[idx - 1] : null;
  const next = idx < allItems.length - 1 ? allItems[idx + 1] : null;

  const article = document.getElementById('article');
  article.setAttribute('data-lang', currentLang);
  article.innerHTML = `
    <div class="article-eyebrow">
      <span class="num">${item.num}</span>
      <span class="sep">\u2014</span>
      <span>${getTitle(topic)}</span>
    </div>
    <h1 class="article-title">${getTitle(item)}</h1>
    <p class="article-alt-title">${getAltTitle(item)}</p>
    <div class="article-body" id="articleMainBody">${parseMarkdown(mainPart)}</div>
    ${qantasPart ? `
      <div class="qantas-section">
        <div class="qantas-mark">${getStr('qantasMark')}</div>
        <div class="article-body">${parseMarkdown(qantasPart)}</div>
      </div>
    ` : ''}
    <div class="item-nav">
      ${prev ? `
        <a class="prev" onclick="showItem(${prev.topic}, '${prev.item}')">
          <span class="nav-label">\u2190 ${getStr('prev')}</span>
          <span class="nav-num">${prev.item}</span> \u00b7 ${prev.title}
        </a>` : '<span></span>'}
      ${next ? `
        <a class="next" onclick="showItem(${next.topic}, '${next.item}')">
          <span class="nav-label">${getStr('next')} \u2192</span>
          <span class="nav-num">${next.item}</span> \u00b7 ${next.title}
        </a>` : '<span></span>'}
    </div>
  `;
  
  const mainBody = document.getElementById('articleMainBody');
  if (mainBody) {
    const toc = buildTOC(mainBody);
    if (toc.length >= 3) {
      const tocHtml = `
        <nav class="article-toc" aria-label="On this page">
          <div class="article-toc-label">${getStr('onThisPage')}</div>
          <ul>
            ${toc.map(s => `<li><a href="#${s.id}" onclick="event.preventDefault(); document.getElementById('${s.id}').scrollIntoView({behavior:'smooth', block:'start'});">${s.text}</a></li>`).join('')}
          </ul>
        </nav>
      `;
      mainBody.insertAdjacentHTML('beforebegin', tocHtml);
    }
  }
}

function showItem(topicNum, itemNum) {
  currentItem = {topic: topicNum, item: itemNum};
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('article').classList.add('active');
  renderArticle(topicNum, itemNum);
  renderBreadcrumb();
  renderSidebar();
  window.scrollTo({top: 0, behavior: 'smooth'});
  history.replaceState(null, '', '#' + itemNum);
}

function showWelcome() {
  currentItem = null;
  document.getElementById('article').classList.remove('active');
  document.getElementById('welcome').style.display = 'block';
  renderWelcome();
  renderBreadcrumb();
  renderSidebar();
  window.scrollTo({top: 0, behavior: 'smooth'});
  history.replaceState(null, '', '#');
}

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === theme);
  });
  try { localStorage.setItem('kb-theme', theme); } catch(e) {}
}

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  if (currentItem) {
    renderArticle(currentItem.topic, currentItem.item);
  } else {
    renderWelcome();
  }
  renderBreadcrumb();
  renderSidebar();
  try { localStorage.setItem('kb-lang', lang); } catch(e) {}
}

// === Mobile drawer ===
function openDrawer() { document.body.classList.add('drawer-open'); }
function closeDrawer() { document.body.classList.remove('drawer-open'); }
function toggleDrawer() { document.body.classList.toggle('drawer-open'); }

document.getElementById('langToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  if (e.target.dataset.lang === currentLang) return;
  applyLang(e.target.dataset.lang);
});

document.getElementById('themeToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  if (e.target.dataset.theme === currentTheme) return;
  applyTheme(e.target.dataset.theme);
});

document.querySelector('.brand').addEventListener('click', () => {
  showWelcome();
  closeDrawer();
});

const mb = document.getElementById('mobileMenuBtn');
if (mb) mb.addEventListener('click', toggleDrawer);
const ov = document.getElementById('drawerOverlay');
if (ov) ov.addEventListener('click', closeDrawer);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
});

function init() {
  try {
    const savedTheme = localStorage.getItem('kb-theme');
    if (savedTheme && THEMES[savedTheme]) currentTheme = savedTheme;
    const savedLang = localStorage.getItem('kb-lang');
    if (savedLang && (savedLang === 'en' || savedLang === 'zh')) currentLang = savedLang;
  } catch(e) {}
  
  applyTheme(currentTheme);
  applyLang(currentLang);
  
  const hash = window.location.hash.slice(1);
  if (hash && /^\d+\.\d+$/.test(hash)) {
    const topicNum = parseInt(hash.split('.')[0]);
    showItem(topicNum, hash);
  } else {
    showWelcome();
  }
}

async function bootstrap() {
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    if (Array.isArray(payload)) {
      VOLUMES = [{num: 1, title_en: 'All topics', title_zh: '\u5168\u90e8\u4e3b\u9898', subtitle_en: '', subtitle_zh: ''}];
      KB = payload.map(t => ({...t, volume: 1}));
    } else {
      VOLUMES = payload.volumes || [];
      KB = payload.topics || [];
    }
  } catch (err) {
    document.body.innerHTML = '<div style="padding: 60px; font-family: system-ui; color: #a83232;"><h1>Could not load data.json</h1><p>Make sure index.html and data.json are served from the same folder.</p><pre>' + err + '</pre><p style="margin-top: 24px; font-size: 14px; color: #666;">Tip: open this folder with a local web server, e.g. <code>python3 -m http.server</code>, then visit http://localhost:8000</p></div>';
    return;
  }
  init();
}
bootstrap();
