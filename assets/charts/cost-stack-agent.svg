<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" class="kb-chart" role="img" aria-label="Agent cost compounds across 8 loop steps because input grows each turn">
  <style>
    .kb-chart text { font-family: var(--sans, system-ui), sans-serif; fill: var(--ink, #1a1a1a); }
    .kb-chart .axis-line { stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .tick { stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .grid { stroke: var(--rule, #d8d2c4); stroke-width: 1; stroke-dasharray: 2,3; }
    .kb-chart .bar-in { fill: var(--ink, #1a1a1a); opacity: 0.10; stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .bar-out { fill: var(--accent, #a83232); opacity: 0.32; stroke: var(--accent, #a83232); stroke-width: 1; }
    .kb-chart .baseline { stroke: var(--accent, #a83232); stroke-width: 1; stroke-dasharray: 4,3; fill: none; }
    .kb-chart .step-label { font-size: 10px; fill: var(--ink-muted, #8a8580); }
    .kb-chart .axis-label { font-size: 10px; fill: var(--ink-muted, #8a8580); }
    .kb-chart .title-tag { font-size: 10px; letter-spacing: 0.18em; fill: var(--ink-muted, #8a8580); font-weight: 600; }
    .kb-chart .legend-label { font-size: 10px; fill: var(--ink, #1a1a1a); font-weight: 500; }
    .kb-chart .legend-sub { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .callout { font-size: 11px; fill: var(--accent, #a83232); font-weight: 600; }
    .kb-chart .callout-sub { font-size: 10px; fill: var(--accent, #a83232); }
    .kb-chart .footnote { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .zh { display: none; }
    [data-lang="zh"] .kb-chart .en { display: none; }
    [data-lang="zh"] .kb-chart .zh { display: inline; }
    [data-lang="zh"] .kb-chart .legend-sub,
    [data-lang="zh"] .kb-chart .footnote { font-style: normal; }
  </style>
  <text x="40" y="28" class="title-tag">
    <tspan class="en">AGENT COST COMPOUNDING · 8 STEP TASK · TOKENS PER STEP</tspan>
    <tspan class="zh">AGENT 成本累积 · 8 步任务 · 每步 TOKEN 数</tspan>
  </text>
  <rect x="40" y="48" width="14" height="10" class="bar-in"/>
  <text x="60" y="57" class="legend-label">
    <tspan class="en">Input tokens (grows each step)</tspan>
    <tspan class="zh">输入 token (每步增长)</tspan>
  </text>
  <rect x="260" y="48" width="14" height="10" class="bar-out"/>
  <text x="280" y="57" class="legend-label">
    <tspan class="en">Output tokens (stable, but 3 to 5x cost)</tspan>
    <tspan class="zh">输出 token (稳定,但成本 3 至 5 倍)</tspan>
  </text>
  <line x1="80" y1="80" x2="80" y2="270" class="axis-line"/>
  <line x1="80" y1="270" x2="690" y2="270" class="axis-line"/>
  <line x1="80" y1="270" x2="76" y2="270" class="tick"/>
  <line x1="80" y1="230" x2="76" y2="230" class="tick"/>
  <line x1="80" y1="190" x2="76" y2="190" class="tick"/>
  <line x1="80" y1="150" x2="76" y2="150" class="tick"/>
  <line x1="80" y1="110" x2="76" y2="110" class="tick"/>
  <text x="70" y="273" class="axis-label" text-anchor="end">0</text>
  <text x="70" y="233" class="axis-label" text-anchor="end">2K</text>
  <text x="70" y="193" class="axis-label" text-anchor="end">4K</text>
  <text x="70" y="153" class="axis-label" text-anchor="end">6K</text>
  <text x="70" y="113" class="axis-label" text-anchor="end">8K</text>
  <line x1="80" y1="210" x2="690" y2="210" class="baseline"/>
  <text x="685" y="206" class="callout-sub" text-anchor="end">
    <tspan class="en">step 1 baseline · 3K input</tspan>
    <tspan class="zh">第 1 步基线 · 3K 输入</tspan>
  </text>
  <g>
    <rect x="105" y="210" width="50" height="60" class="bar-in"/>
    <rect x="105" y="202" width="50" height="8" class="bar-out"/>
    <text x="130" y="285" class="step-label" text-anchor="middle">1</text>
  </g>
  <g>
    <rect x="175" y="202" width="50" height="68" class="bar-in"/>
    <rect x="175" y="194" width="50" height="8" class="bar-out"/>
    <text x="200" y="285" class="step-label" text-anchor="middle">2</text>
  </g>
  <g>
    <rect x="245" y="194" width="50" height="76" class="bar-in"/>
    <rect x="245" y="186" width="50" height="8" class="bar-out"/>
    <text x="270" y="285" class="step-label" text-anchor="middle">3</text>
  </g>
  <g>
    <rect x="315" y="186" width="50" height="84" class="bar-in"/>
    <rect x="315" y="178" width="50" height="8" class="bar-out"/>
    <text x="340" y="285" class="step-label" text-anchor="middle">4</text>
  </g>
  <g>
    <rect x="385" y="178" width="50" height="92" class="bar-in"/>
    <rect x="385" y="170" width="50" height="8" class="bar-out"/>
    <text x="410" y="285" class="step-label" text-anchor="middle">5</text>
  </g>
  <g>
    <rect x="455" y="170" width="50" height="100" class="bar-in"/>
    <rect x="455" y="162" width="50" height="8" class="bar-out"/>
    <text x="480" y="285" class="step-label" text-anchor="middle">6</text>
  </g>
  <g>
    <rect x="525" y="162" width="50" height="108" class="bar-in"/>
    <rect x="525" y="154" width="50" height="8" class="bar-out"/>
    <text x="550" y="285" class="step-label" text-anchor="middle">7</text>
  </g>
  <g>
    <rect x="595" y="154" width="50" height="116" class="bar-in"/>
    <rect x="595" y="146" width="50" height="8" class="bar-out"/>
    <text x="620" y="285" class="step-label" text-anchor="middle">8</text>
  </g>
  <text x="385" y="306" class="axis-label" text-anchor="middle">
    <tspan class="en">step number in the loop</tspan>
    <tspan class="zh">循环中的步数</tspan>
  </text>
  <path d="M 660 150 L 660 130" class="baseline"/>
  <text x="660" y="124" class="callout" text-anchor="end">
    <tspan class="en">step 8: 5.8K input</tspan>
    <tspan class="zh">第 8 步: 5.8K 输入</tspan>
  </text>
  <text x="660" y="138" class="callout-sub" text-anchor="end">
    <tspan class="en">~2x of step 1</tspan>
    <tspan class="zh">是第 1 步的约 2 倍</tspan>
  </text>
  <text x="40" y="332" class="footnote">
    <tspan class="en">Output stays ~400 tokens per step. Input compounds because every step appends prior outputs.</tspan>
    <tspan class="zh">输出每步约 400 token 稳定。输入累积,因为每步都拼接之前所有输出。</tspan>
  </text>
  <text x="40" y="346" class="footnote">
    <tspan class="en">Total agent task = 12x a single chat call, not 8x.</tspan>
    <tspan class="zh">整次 agent 任务约等于单次 chat 调用的 12 倍,不是 8 倍。</tspan>
  </text>
</svg>
