<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" class="kb-chart" role="img" aria-label="Agent loop with stop conditions">
  <style>
    .kb-chart text { font-family: var(--sans, system-ui), sans-serif; fill: var(--ink, #1a1a1a); }
    .kb-chart .node { fill: none; stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .node-llm { fill: var(--accent, #a83232); fill-opacity: 0.10; stroke: var(--accent, #a83232); stroke-width: 1.25; }
    .kb-chart .node-stop { fill: none; stroke: var(--ink, #1a1a1a); stroke-width: 1; stroke-dasharray: 3,2; }
    .kb-chart .node-label { font-size: 13px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .kb-chart .node-sub { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .node-num { font-size: 10px; letter-spacing: 0.14em; font-weight: 600; fill: var(--accent, #a83232); }
    .kb-chart .arrow { stroke: var(--accent, #a83232); stroke-width: 1.25; fill: none; }
    .kb-chart .arrow-stop { stroke: var(--ink, #1a1a1a); stroke-width: 1; fill: none; stroke-dasharray: 3,2; }
    .kb-chart .arrowhead { fill: var(--accent, #a83232); }
    .kb-chart .arrowhead-stop { fill: var(--ink, #1a1a1a); }
    .kb-chart .branch-label { font-size: 10px; fill: var(--accent, #a83232); font-weight: 600; letter-spacing: 0.05em; }
    .kb-chart .branch-stop { font-size: 10px; fill: var(--ink-muted, #8a8580); font-weight: 600; letter-spacing: 0.05em; }
    .kb-chart .title-tag { font-size: 10px; letter-spacing: 0.18em; fill: var(--ink-muted, #8a8580); font-weight: 600; }
    .kb-chart .footnote { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .zh { display: none; }
    [data-lang="zh"] .kb-chart .en { display: none; }
    [data-lang="zh"] .kb-chart .zh { display: inline; }
    [data-lang="zh"] .kb-chart .node-sub,
    [data-lang="zh"] .kb-chart .footnote { font-style: normal; }
  </style>
  <defs>
    <marker id="agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="agent-arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-stop"/>
    </marker>
  </defs>
  <text x="40" y="28" class="title-tag">
    <tspan class="en">AGENT LOOP · LLM + TOOLS + MEMORY</tspan>
    <tspan class="zh">AGENT 循环 · LLM + 工具 + 记忆</tspan>
  </text>
  <rect x="220" y="70" width="180" height="70" class="node-llm"/>
  <text x="232" y="90" class="node-num">01</text>
  <text x="232" y="110" class="node-label">
    <tspan class="en">LLM decides</tspan>
    <tspan class="zh">LLM 决策</tspan>
  </text>
  <text x="232" y="126" class="node-sub">
    <tspan class="en">which tool, or done?</tspan>
    <tspan class="zh">用哪个工具,还是完成?</tspan>
  </text>
  <path d="M 400 105 L 460 105" class="arrow" marker-end="url(#agent-arrow)"/>
  <text x="430" y="98" class="branch-label" text-anchor="middle">
    <tspan class="en">CONTINUE</tspan>
    <tspan class="zh">继续</tspan>
  </text>
  <rect x="460" y="70" width="180" height="70" class="node"/>
  <text x="472" y="90" class="node-num">02</text>
  <text x="472" y="110" class="node-label">
    <tspan class="en">Execute action</tspan>
    <tspan class="zh">执行动作</tspan>
  </text>
  <text x="472" y="126" class="node-sub">
    <tspan class="en">call tool · run code · search</tspan>
    <tspan class="zh">调工具 · 跑代码 · 搜索</tspan>
  </text>
  <path d="M 550 140 L 550 195" class="arrow" marker-end="url(#agent-arrow)"/>
  <rect x="460" y="200" width="180" height="70" class="node"/>
  <text x="472" y="220" class="node-num">03</text>
  <text x="472" y="240" class="node-label">
    <tspan class="en">Observe result</tspan>
    <tspan class="zh">观察结果</tspan>
  </text>
  <text x="472" y="256" class="node-sub">
    <tspan class="en">add to memory · update context</tspan>
    <tspan class="zh">加入记忆 · 更新上下文</tspan>
  </text>
  <path d="M 460 235 L 310 235 L 310 140" class="arrow" marker-end="url(#agent-arrow)"/>
  <text x="385" y="228" class="branch-label" text-anchor="middle">
    <tspan class="en">LOOP BACK</tspan>
    <tspan class="zh">回到决策</tspan>
  </text>
  <path d="M 220 105 L 160 105" class="arrow-stop" marker-end="url(#agent-arrow-stop)"/>
  <text x="190" y="98" class="branch-stop" text-anchor="middle">
    <tspan class="en">STOP</tspan>
    <tspan class="zh">停止</tspan>
  </text>
  <rect x="40" y="70" width="120" height="70" class="node-stop"/>
  <text x="100" y="105" class="node-label" text-anchor="middle">
    <tspan class="en">Done</tspan>
    <tspan class="zh">完成</tspan>
  </text>
  <text x="100" y="122" class="node-sub" text-anchor="middle">
    <tspan class="en">final answer</tspan>
    <tspan class="zh">最终回答</tspan>
  </text>
  <text x="40" y="316" class="footnote">
    <tspan class="en">Stop conditions: task done · max steps reached · error · timeout · cost ceiling.</tspan>
    <tspan class="zh">停止条件: 任务完成 · 达到步数上限 · 错误 · 超时 · 成本上限。</tspan>
  </text>
  <text x="40" y="332" class="footnote">
    <tspan class="en">Without them, the loop never ends. The defining feature of an agent is the loop, not the LLM call.</tspan>
    <tspan class="zh">没有这些,循环永远不结束。Agent 的本质是循环,不是单次 LLM 调用。</tspan>
  </text>
</svg>
