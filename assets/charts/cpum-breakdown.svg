<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" class="kb-chart" role="img" aria-label="Cost per user per month breakdown across LLM, infra, third party, overhead">
  <style>
    .kb-chart text { font-family: var(--sans, system-ui), sans-serif; fill: var(--ink, #1a1a1a); }
    .kb-chart .axis-line { stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .tick { stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .grid { stroke: var(--rule, #d8d2c4); stroke-width: 1; stroke-dasharray: 2,3; }
    .kb-chart .seg { stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .seg-1 { fill: var(--accent, #a83232); opacity: 0.40; }
    .kb-chart .seg-2 { fill: var(--accent, #a83232); opacity: 0.22; }
    .kb-chart .seg-3 { fill: var(--ink, #1a1a1a); opacity: 0.14; }
    .kb-chart .seg-4 { fill: var(--ink, #1a1a1a); opacity: 0.06; }
    .kb-chart .row-label { font-size: 12px; font-weight: 600; fill: var(--ink, #1a1a1a); }
    .kb-chart .row-sub { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .legend-box { stroke: var(--ink, #1a1a1a); stroke-width: 1; }
    .kb-chart .legend-label { font-size: 10px; fill: var(--ink, #1a1a1a); font-weight: 500; }
    .kb-chart .legend-range { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .axis-label { font-size: 10px; fill: var(--ink-muted, #8a8580); }
    .kb-chart .title-tag { font-size: 10px; letter-spacing: 0.18em; fill: var(--ink-muted, #8a8580); font-weight: 600; }
    .kb-chart .value { font-size: 11px; font-weight: 600; fill: var(--accent, #a83232); }
    .kb-chart .footnote { font-size: 10px; fill: var(--ink-muted, #8a8580); font-style: italic; }
    .kb-chart .zh { display: none; }
    [data-lang="zh"] .kb-chart .en { display: none; }
    [data-lang="zh"] .kb-chart .zh { display: inline; }
    [data-lang="zh"] .kb-chart .row-sub,
    [data-lang="zh"] .kb-chart .legend-range,
    [data-lang="zh"] .kb-chart .footnote { font-style: normal; }
  </style>
  <text x="40" y="28" class="title-tag">
    <tspan class="en">CPUM BREAKDOWN · TYPICAL ENTERPRISE DEPLOYMENT · USD</tspan>
    <tspan class="zh">CPUM 构成 · 典型企业部署 · 美元</tspan>
  </text>
  <rect x="40" y="52" width="14" height="10" class="seg seg-1"/>
  <text x="60" y="61" class="legend-label">
    <tspan class="en">LLM tokens (input + output)</tspan>
    <tspan class="zh">LLM token (输入 + 输出)</tspan>
  </text>
  <text x="60" y="74" class="legend-range">
    <tspan class="en">$0.10 to $5 per user</tspan>
    <tspan class="zh">$0.10 至 $5 每用户</tspan>
  </text>
  <rect x="220" y="52" width="14" height="10" class="seg seg-2"/>
  <text x="240" y="61" class="legend-label">
    <tspan class="en">Third party APIs (embedding, tools)</tspan>
    <tspan class="zh">第三方 API (嵌入、工具)</tspan>
  </text>
  <text x="240" y="74" class="legend-range">
    <tspan class="en">$0.02 to $0.30 per user</tspan>
    <tspan class="zh">$0.02 至 $0.30 每用户</tspan>
  </text>
  <rect x="440" y="52" width="14" height="10" class="seg seg-3"/>
  <text x="460" y="61" class="legend-label">
    <tspan class="en">Infrastructure (vector DB, hosting, obs)</tspan>
    <tspan class="zh">基础设施 (向量库、托管、监控)</tspan>
  </text>
  <text x="460" y="74" class="legend-range">
    <tspan class="en">$0.05 to $0.50 per user</tspan>
    <tspan class="zh">$0.05 至 $0.50 每用户</tspan>
  </text>
  <rect x="40" y="92" width="14" height="10" class="seg seg-4"/>
  <text x="60" y="101" class="legend-label">
    <tspan class="en">Overhead (evals, retries, support)</tspan>
    <tspan class="zh">间接成本 (评估、重试、支持)</tspan>
  </text>
  <text x="60" y="114" class="legend-range">
    <tspan class="en">add 20 to 40% on top</tspan>
    <tspan class="zh">在上面加 20% 到 40%</tspan>
  </text>
  <text x="40" y="155" class="row-label">
    <tspan class="en">Light workload</tspan>
    <tspan class="zh">轻量工作负载</tspan>
  </text>
  <text x="40" y="169" class="row-sub">
    <tspan class="en">internal search · 30 queries</tspan>
    <tspan class="zh">内部检索 · 30 次查询</tspan>
  </text>
  <rect x="220" y="148" width="36" height="26" class="seg seg-1"/>
  <rect x="256" y="148" width="6" height="26" class="seg seg-2"/>
  <rect x="262" y="148" width="12" height="26" class="seg seg-3"/>
  <rect x="274" y="148" width="14" height="26" class="seg seg-4"/>
  <text x="298" y="166" class="value">~ $0.80</text>
  <text x="40" y="217" class="row-label">
    <tspan class="en">Medium workload</tspan>
    <tspan class="zh">中等工作负载</tspan>
  </text>
  <text x="40" y="231" class="row-sub">
    <tspan class="en">support bot · tiered routing</tspan>
    <tspan class="zh">客服机器人 · 分层路由</tspan>
  </text>
  <rect x="220" y="210" width="80" height="26" class="seg seg-1"/>
  <rect x="300" y="210" width="14" height="26" class="seg seg-2"/>
  <rect x="314" y="210" width="22" height="26" class="seg seg-3"/>
  <rect x="336" y="210" width="32" height="26" class="seg seg-4"/>
  <text x="378" y="228" class="value">~ $2.00</text>
  <text x="40" y="279" class="row-label">
    <tspan class="en">Heavy workload</tspan>
    <tspan class="zh">重度工作负载</tspan>
  </text>
  <text x="40" y="293" class="row-sub">
    <tspan class="en">sales agent · flagship</tspan>
    <tspan class="zh">销售代理 · 旗舰</tspan>
  </text>
  <rect x="220" y="272" width="280" height="26" class="seg seg-1"/>
  <rect x="500" y="272" width="22" height="26" class="seg seg-2"/>
  <rect x="522" y="272" width="34" height="26" class="seg seg-3"/>
  <rect x="556" y="272" width="78" height="26" class="seg seg-4"/>
  <text x="644" y="290" class="value">~ $25</text>
  <text x="40" y="328" class="footnote">
    <tspan class="en">LLM tokens dominate. Model tiering and prompt caching attack the biggest segment first.</tspan>
    <tspan class="zh">LLM token 占大头。模型分层和提示缓存优先攻击最大那段。</tspan>
  </text>
</svg>
